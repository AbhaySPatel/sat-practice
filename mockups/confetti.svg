<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <g transform="translate(60,60)">
    <rect x="0" y="0" rx="20" width="780" height="300" fill="#fff" stroke="#e6edf7"/>
    <text x="36" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Confetti (canvas-confetti)</text>
    <text x="36" y="82" font-family="Inter, sans-serif" font-size="14" fill="#475569">Polished falling confetti — colourful pieces burst from top.</text>
    <!-- Confetti pieces -->
    <g opacity="0.95">
      <rect x="120" y="120" width="10" height="18" fill="#ef4444" transform="rotate(25 125 129)" />
      <rect x="160" y="90" width="12" height="20" fill="#f59e0b" transform="rotate(-18 166 100)" />
      <rect x="200" y="140" width="8" height="16" fill="#10b981" transform="rotate(10 204 148)" />
      <rect x="260" y="100" width="14" height="22" fill="#3b82f6" transform="rotate(-30 267 111)" />
      <rect x="340" y="110" width="10" height="20" fill="#8b5cf6" transform="rotate(12 345 120)" />
      <rect x="420" y="130" width="12" height="18" fill="#06b6d4" transform="rotate(-6 426 139)" />
      <rect x="520" y="95" width="10" height="20" fill="#ec4899" transform="rotate(18 525 105)" />
      <rect x="620" y="125" width="12" height="20" fill="#84cc16" transform="rotate(-22 626 135)" />
      <rect x="700" y="115" width="10" height="18" fill="#f97316" transform="rotate(8 705 124)" />
    </g>
    <!-- example check -->
    <circle cx="680" cy="60" r="22" fill="#16a34a" />
    <text x="672" y="68" font-family="Inter, sans-serif" font-size="18" fill="#fff">✔</text>
  </g>
</svg>