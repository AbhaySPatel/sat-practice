<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  <g transform="translate(60,60)">
    <rect x="0" y="0" rx="20" width="780" height="300" fill="#fff" stroke="#e6edf7"/>
    <text x="36" y="50" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0f172a">CSS-only Confetti</text>
    <text x="36" y="82" font-family="Inter, sans-serif" font-size="14" fill="#475569">Simple, CSS-animated confetti-like pieces using transforms.</text>
    <!-- pseudo-confetti shapes -->
    <rect x="140" y="130" rx="2" width="8" height="22" fill="#f43f5e" transform="rotate(15 144 141)" />
    <rect x="180" y="120" rx="2" width="10" height="24" fill="#fb923c" transform="rotate(-20 185 132)" />
    <rect x="240" y="140" rx="2" width="6" height="18" fill="#60a5fa" transform="rotate(8 243 149)" />
    <rect x="360" y="130" rx="2" width="12" height="20" fill="#a78bfa" transform="rotate(-10 366 140)" />
  </g>
</svg>